# This workflow will install Python dependencies, run tests and lint on the
# supported Python versions.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    name: test (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      # One failing Python version must not cancel the others, so that the
      # summary shows exactly which version failed.
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[tui,log,test]"
    - name: Lint with ruff
      run: |
        ruff check .
    - name: Check formatting with ruff
      run: |
        ruff format --check .
    - name: Test with pytest
      run: |
        pytest --cov=takler --cov-report=xml --cov-report=term
    # Requirement 16.11 puts the 85% floor on `takler/client` and the
    # Protocol_Layer, not on the whole package, so the gate re-reports the data
    # file written above with that scope instead of living in `--cov-fail-under`.
    # The generated `*_pb2*.py` stubs are dropped by `[tool.coverage.run] omit`
    # in `pyproject.toml`, so `protocol/*` here means the hand written protocol
    # code only.
    - name: Coverage gate for client and protocol layer
      run: |
        coverage report --include="takler/client/*,takler/server/network_service.py,takler/server/protocol/*" --fail-under=85

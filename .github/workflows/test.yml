# 测试与静态检查流程：在受支持的 Python 版本上装好依赖，跑 ruff 与 pytest。
#
# 环境由 uv 从 `uv.lock` 还原（`uv sync --locked`），而不是让 pip 现场解析
# `pyproject.toml` 的版本下界。原因是后者会让 CI 和开发机拿到不同的依赖版本：本仓库
# 曾因此出现本地 `ruff check` 全绿、CI 报 1212 条错误的情况——`ruff>=0.5` 在 CI 上解析
# 到 0.16，而 0.16 把默认启用的规则从 59 条扩到了 413 条。锁文件加上
# `[tool.ruff.lint] select` 一起，才让"本地通过"真正等价于"CI 通过"。
#
# 因此这里的每条命令都走 `uv run`（用 `uv sync` 建好的锁定环境），而不是裸调用
# PATH 上的可执行文件。
#
# 关于 uv 的用法见 https://docs.astral.sh/uv/guides/integration/github/

name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: test (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      # One failing Python version must not cancel the others, so that the
      # summary shows exactly which version failed.
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4
      with:
        # setuptools_scm 从 git 历史和 tag 推导版本号，浅克隆（默认 depth=1）拿不到
        # tag，`uv sync` 构建本项目时就会得到一个与仓库状态无关的版本号。
        fetch-depth: 0
    - name: Install uv and set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v9
      with:
        # setup-uv 设置的 Python 版本会覆盖 `pyproject.toml` / `.python-version` 里的
        # 取值，这样矩阵的每个分支才真的跑在各自的解释器上。
        python-version: ${{ matrix.python-version }}
        # 跨 workflow 复用 uv 的下载/构建缓存，缓存键跟随 `uv.lock`。
        enable-cache: true
    - name: Install the project
      run: |
        uv sync --locked --extra tui --extra log --extra test
      # `--locked`：锁文件与 `pyproject.toml` 不一致时直接失败，而不是就地重新解析。
      # 忘记提交 `uv lock` 的改动会在这一步暴露，而不是变成一次隐式的依赖升级。
      # 三个 extra 是用户可见的可选依赖；`dev` 依赖组（ruff 在其中）由 `uv sync`
      # 默认包含，无需显式声明。
    - name: Lint with ruff
      run: |
        uv run ruff check .
    - name: Check formatting with ruff
      run: |
        uv run ruff format --check .
    - name: Test with pytest
      run: |
        uv run pytest --cov=takler --cov-report=xml --cov-report=term
    # Requirement 16.11 puts the 85% floor on `takler/client` and the
    # Protocol_Layer, not on the whole package, so the gate re-reports the data
    # file written above with that scope instead of living in `--cov-fail-under`.
    # The generated `*_pb2*.py` stubs are dropped by `[tool.coverage.run] omit`
    # in `pyproject.toml`, so `protocol/*` here means the hand written protocol
    # code only.
    - name: Coverage gate for client and protocol layer
      run: |
        uv run coverage report --include="takler/client/*,takler/server/network_service.py,takler/server/protocol/*" --fail-under=85

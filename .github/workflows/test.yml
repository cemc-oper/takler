# 测试与静态检查流程：在受支持的 Python 版本上装好依赖，跑 ruff 与 pytest。
#
# 环境由 uv 从 `uv.lock` 还原（`uv sync --locked`），而不是让 pip 现场解析
# `pyproject.toml` 的版本下界。原因是后者会让 CI 和开发机拿到不同的依赖版本：本仓库
# 曾因此出现本地 `ruff check` 全绿、CI 报 1212 条错误的情况——`ruff>=0.5` 在 CI 上解析
# 到 0.16，而 0.16 把默认启用的规则从 59 条扩到了 413 条。锁文件加上
# `[tool.ruff.lint] select` 一起，才让"本地通过"真正等价于"CI 通过"。
#
# 因此这里的每条命令都走 `uv run`（用 `uv sync` 建好的锁定环境），而不是裸调用
# PATH 上的可执行文件。
#
# 关于 uv 的用法见 https://docs.astral.sh/uv/guides/integration/github/

name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: test (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      # One failing Python version must not cancel the others, so that the
      # summary shows exactly which version failed.
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4
      with:
        # setuptools_scm 从 git 历史和 tag 推导版本号，浅克隆（默认 depth=1）拿不到
        # tag，`uv sync` 构建本项目时就会得到一个与仓库状态无关的版本号。
        fetch-depth: 0
    - name: Install uv and set up Python ${{ matrix.python-version }}
      # 必须写精确版本：setup-uv 从 v8 起不再维护浮动的大版本 tag（`v1`..`v7` 有，
      # `v8`/`v9`/`v10` 没有），`@v10` 这类写法会以
      # "unable to resolve action ... unable to find version" 失败。
      # 想要更强的供应链保证可以改成 commit SHA 加版本注释，即上游文档的写法：
      #     astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      uses: astral-sh/setup-uv@v10.0.1
      with:
        # setup-uv 设置的 Python 版本会覆盖 `pyproject.toml` / `.python-version` 里的
        # 取值，这样矩阵的每个分支才真的跑在各自的解释器上。
        python-version: ${{ matrix.python-version }}
        # 跨 workflow 复用 uv 的下载/构建缓存，缓存键跟随 `uv.lock`。
        enable-cache: true
    - name: Install the project
      run: |
        uv sync --locked --all-groups
      # `--locked`：锁文件与 `pyproject.toml` 不一致时直接失败，而不是就地重新解析。
      # 忘记提交 `uv lock` 的改动会在这一步暴露，而不是变成一次隐式的依赖升级。
      # `--all-groups` 装齐 dev、test、docs 三个组（dev 通过 include-group 已含
      # test，并通过自引用带上 tui/log 两个 extra，无需单独 `--extra`）。
      # `docs` 组必须装：`tests/doc/test_doc_build.py` 会在测试环境内跑
      # `sphinx-build -W`，缺了 sphinx 该测试直接失败。
    - name: Lint with ruff
      run: |
        uv run ruff check .
    - name: Check formatting with ruff
      run: |
        uv run ruff format --check .
    - name: Test with pytest
      run: |
        uv run pytest --cov=takler --cov-report=xml --cov-report=term
    # Requirement 16.11 puts the 85% floor on `takler/client` and the
    # Protocol_Layer, not on the whole package, so the gate re-reports the data
    # file written above with that scope instead of living in `--cov-fail-under`.
    # The generated `*_pb2*.py` stubs are dropped by `[tool.coverage.run] omit`
    # in `pyproject.toml`, so `protocol/*` here means the hand written protocol
    # code only. `src/takler/protocol/*` is the transport-neutral DTO layer
    # added in M3 (task 3); `server/handlers.py` is the transport-neutral
    # command handler layer added in M3 (task 5); `server/transport.py` and
    # `server/grpc_transport.py` are the transport mount point and the gRPC
    # transport added in M3 (task 6); `server/http_transport.py` is the HTTP
    # transport added in M3 (task 7).
    - name: Coverage gate for client and protocol layer
      run: |
        uv run coverage report --include="src/takler/client/*,src/takler/server/transport.py,src/takler/server/grpc_transport.py,src/takler/server/http_transport.py,src/takler/server/handlers.py,src/takler/server/protocol/*,src/takler/protocol/*" --fail-under=85
    # M2 requirement 16.11 puts the same 85% floor on the four modules the
    # security work added. It is a separate step from the gate above, and it
    # checks the four modules *one at a time* rather than passing all four to a
    # single `--include`: `--fail-under` compares the total over the included
    # files, so one aggregate check would let `tls.py` (100%, 70 statements)
    # carry a regressed `auth.py` (301 statements) over the line. The loop keeps
    # going after the first failure so a run reports every module that dropped,
    # not just the first one alphabetically.
    - name: Coverage gate for security modules
      run: |
        failed=""
        for module in auth zombie audit tls; do
          echo "== src/takler/server/$module.py"
          uv run coverage report --include="src/takler/server/$module.py" --fail-under=85 || failed="$failed src/takler/server/$module.py"
        done
        if [ -n "$failed" ]; then
          echo "statement coverage below 85% for:$failed" >&2
          exit 1
        fi

  proto-drift:

    name: proto drift check

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    # 两层校验，脚本见 scripts/check_proto.sh：
    #   1. 新鲜度——提交进来的 takler_pb2*.py 与用锁定 grpcio-tools 现场重新生成的
    #      结果 diff 为空（改了 proto 忘了重新生成会在这里暴露）；
    #   2. 跨仓漂移——takler-client 仓的 takler_protocol/takler.proto 与本仓的
    #      事实来源逐字节一致（Go 端落后时本 job 变红）。takler-client 的副本经
    #      raw.githubusercontent.com 拉取；takler-client 侧 CI 跑的是镜像检查。
    - name: Proto drift and freshness check
      run: ./scripts/check_proto.sh

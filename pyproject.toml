[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "takler"
authors = [
    {name="Wang Dapeng", email="perillaroc@gmail.com"}
]
description = "A workflow tool for CEMC/CMA."
readme = "README.md"
keywords = ["workflow", "cemc"]
license = { text = "Apache-2.0" }
dynamic = ["version"]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',

    "Intended Audience :: Developers",

    'License :: OSI Approved :: Apache Software License',

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    'anyio',
    'lark',
    'grpcio',
    'jinja2',
    'pydantic>=2.0',
    'typer',
    'pyyaml',
    'protobuf',
    'importlib-metadata; python_version<"3.8"',
]

[project.urls]
Homepage = "https://github.com/perillaroc/takler"
Repository = "https://github.com/perillaroc/takler.git"

[dependency-groups]
dev = [
    "build",
    "twine",
    "ipython",
]

test = [
    "pytest",
    "pytest-cov",
    "ruff",
    # Property-based testing for the logging subsystem (optional dev tooling).
    "hypothesis",
]

tui = [
    "textual>=0.60",
    "rich>=13.0",
]

log = [
    "loguru",
]

[tool.pytest.ini_options]
# Use importlib import mode so test packages can mirror source package names
# without colliding with standard-library modules. In particular, the
# `tests/logging/` package would otherwise shadow the stdlib `logging` module
# under the default "prepend" import mode and break collection.
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
version_file = "takler/_version.py"

[tool.ruff]
# 排除 protobuf 生成目录
exclude = [
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
]

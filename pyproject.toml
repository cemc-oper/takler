[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "takler"
authors = [
    {name="Wang Dapeng", email="perillaroc@gmail.com"}
]
description = "A workflow tool for CEMC/CMA."
readme = "README.md"
keywords = ["workflow", "cemc"]
license = { text = "Apache-2.0" }
dynamic = ["version"]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',

    "Intended Audience :: Developers",

    'License :: OSI Approved :: Apache Software License',

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
# Every runtime dependency carries a minimum version lower bound so a
# deployment resolves reproducibly. The bounds are the major.minor line of the
# version pinned in `uv.lock` (i.e. the versions the test suite actually runs
# against), except `pydantic`, whose `>=2.0` bound states the real constraint:
# the code uses the pydantic v2 API.
dependencies = [
    'anyio>=4.13',
    'lark>=1.3',
    'grpcio>=1.80',
    'jinja2>=3.1',
    'pydantic>=2.0',
    'typer>=0.26',
    'pyyaml>=6.0',
    'protobuf>=7.35',
]

# `pip install takler[tui]` / `[log]` / `[test]`. These are user-facing extras,
# not dev tooling, so they live here rather than in `[dependency-groups]`,
# which keeps only the `dev` group. The bounds here are the floors the design
# prescribes (the oldest release providing the API used); every one of them is
# satisfied by the versions pinned in `uv.lock`.
[project.optional-dependencies]
tui = [
    "textual>=0.60",
    "rich>=13.0",
]
log = [
    "loguru>=0.7",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Property-based testing.
    "hypothesis>=6.100",
    # Self-signed certificates and keys for the TLS tests, generated in the
    # test process rather than committed: a checked-in certificate expires and
    # then fails the suite on a date nobody changed anything on. The `>=42`
    # floor is the first release whose `not_valid_before`/`not_valid_after`
    # accept timezone-aware datetimes, which is what the generators pass.
    "cryptography>=42",
    # `ruff` is deliberately *not* here: a linter is not something a user of
    # `pip install takler[test]` needs in order to run the suite. It lives in
    # `[dependency-groups] dev`, which is locked by `uv.lock` and therefore
    # gives CI and a developer machine the exact same ruff.
]

[project.scripts]
# The server entry is deliberately not the bare name `takler`, and the Python
# client entry is not `takler_client`: the latter is the artifact name of the Go
# client (`go build -o ${BIN_PATH}/takler_client`), so either name would shadow
# it on PATH or be mistaken for it.
takler-server = "takler.server.cli:main"
takler-client-py = "takler.client.cli:app"
takler-tui = "takler.tui.__main__:app"

[project.urls]
Homepage = "https://github.com/cemc-oper/takler"
Repository = "https://github.com/cemc-oper/takler.git"
Documentation = "https://takler.readthedocs.io/"

[dependency-groups]
dev = [
    "build",
    "twine",
    "ipython",
    # Linter and formatter. Kept in a dependency group rather than in the
    # user-facing `test` extra: `[dependency-groups]` is not published in the
    # wheel metadata, so nobody installing `takler` drags a linter along, and
    # `uv.lock` pins one exact version for every consumer of the lockfile
    # (`uv run ruff` locally, `uv sync --locked` in CI). The `>=0.15` floor
    # matters together with `[tool.ruff.lint] select`: 0.15 is the first line
    # this project's configuration was validated against.
    "ruff>=0.15",
    # protoc + the gRPC python plugin, needed to regenerate the stubs after
    # editing `src/takler/server/protocol/takler.proto`:
    #     python -m grpc_tools.protoc -Isrc --python_out=src --grpc_python_out=src \
    #         takler/server/protocol/takler.proto
    # The `>=1.83` floor is not cosmetic: grpcio-tools pins a protobuf range,
    # and everything below 1.83 caps it at `<7`, which contradicts this
    # project's own `protobuf>=7.35`. Declaring it here rather than leaving
    # regeneration to an ad-hoc environment is what keeps the generated stubs
    # reproducible.
    "grpcio-tools>=1.83",
]
# Read the Docs installs this group via `uv sync --group docs` (see
# `.readthedocs.yml`). Kept separate from `dev` so a docs-only build doesn't
# also pull in `ruff`/`grpcio-tools`, which it doesn't need.
docs = [
    "sphinx>=8.1",
    "pydata-sphinx-theme>=0.16",
    "sphinx-autodoc-typehints>=2.5",
]

[tool.pytest.ini_options]
# Use importlib import mode so test packages can mirror source package names
# without colliding with standard-library modules. In particular, the
# `tests/logging/` package would otherwise shadow the stdlib `logging` module
# under the default "prepend" import mode and break collection.
addopts = "--import-mode=importlib"
markers = [
    "slow: tests that spawn real processes or otherwise take a long time to run",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools_scm]
version_file = "src/takler/_version.py"

[tool.ruff]
# 排除 protobuf 生成目录
exclude = [
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
]

[tool.ruff.lint]
# 显式声明规则集，而不是沿用 ruff 的版本默认值。不写 `select` 时启用哪些规则由 ruff
# 版本决定：0.16.0 把默认集从 59 条扩到 413 条（新增 isort `I`、pyupgrade `UP`、
# flake8-comprehensions `C4` 等），于是 `uv run`（按 `uv.lock` 用 0.15.x）与 CI
# （`pip install "ruff>=0.5"` 拿到最新版）会给出完全不同的结论——本仓库曾因此本地全绿、
# CI 报 1212 条错误。这里固定的 E4/E7/E9/F 就是 0.16 之前的默认集，与现有代码一致。
# 要采纳 0.16 的新规则应作为一次独立的、有意的改动：在此追加规则前缀并修完对应告警。
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
# protobuf 生成的 stub 不是 Protocol_Layer 的一部分，与 `[tool.ruff] exclude` 保持一致：
# 它们由 `protoc` 生成而非手写，为它们补测试没有意义，计入语句数只会稀释真实覆盖率。
# 在 `run` 段而不是 `report` 段排除，使这两类文件从度量阶段起就不出现，`--cov-report=xml`
# 与后续任何 `coverage report` 调用都自动一致。
omit = [
    "*_pb2.py",
    "*_pb2_grpc.py",
]

[tool.coverage.report]
# 缺失行默认展示，便于本地直接定位未覆盖分支。
show_missing = true
# 这里**不**设置 `fail_under`：需求 16.11 的门槛只针对特定模块而非整个包（包一级现为 79%，
# 主因是 `takler/tui` 缺测试），且 `pytest tests/some_file.py` 这类局部运行不应因门槛失败。
# 门槛因此放在 CI 的独立步骤（见 `.github/workflows/test.yml`），复用本段写出的同一份
# 覆盖率数据、各自限定 `--include` 范围：
#   # M1：客户端与 Protocol_Layer
#   coverage report \
#     --include="src/takler/client/*,src/takler/server/network_service.py,src/takler/server/protocol/*" \
#     --fail-under=85
#   # M2：安全相关新增模块，逐个模块检查（合并成一次 `--include` 会让高覆盖率的小模块
#   # 把回退的大模块托过门槛，因为 `--fail-under` 比的是included文件的合计值）
#   for module in auth zombie audit tls; do
#     coverage report --include="src/takler/server/$module.py" --fail-under=85
#   done

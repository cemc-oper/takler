syntax = "proto3";
/*
This file is the single source of truth of the wire protocol. Both client
implementations mirror it and gate on drift in CI.

Python

    python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. takler/server/protocol/takler.proto

Golang

    The Go stubs live in the takler-client repo and are regenerated there:

        scripts/proto.sh sync

    protoc comes from this repo's locked uv environment (grpcio-tools in the
    dev dependency group), so no separate protoc installation is needed.
*/


option go_package = "github.com/cemc-oper/takler-client/takler_protocol";

package takler_protocol;

message ServiceResponse{
  // 错误分类码（Error_Code）。0 表示成功，非 0 表示失败并标识错误分类。
  // 取值表见 takler/protocol/error_code.py（ERROR_NAME_BY_CODE）。
  // 只判断 flag != 0 的客户端无需改动。
  int32 flag = 1;
  string message = 2;
}

//------------------------------------------
// child command

message ChildCommandOptions {
  string node_path = 1;
}

message InitCommand {
  ChildCommandOptions child_options = 1;
  string task_id = 2;
}

message CompleteCommand {
  ChildCommandOptions child_options = 1;
}

message AbortCommand {
  ChildCommandOptions child_options = 1;
  string reason = 2;
}

message EventCommand {
  ChildCommandOptions child_options = 1;
  string event_name = 2;
}

message MeterCommand {
  ChildCommandOptions child_options = 1;
  string meter_name = 2;
  string meter_value = 3;
}

//------------------------------------------
// control command

message RequeueCommand {
  repeated string node_path = 1;
}

message SuspendCommand {
  repeated string node_path = 1;
}

message ResumeCommand {
  repeated string node_path = 1;
}

message RunCommand {
  bool force = 1;
  repeated string node_path = 2;
}

message ForceCommand {
  enum ForceState {
    unknown = 0;
    complete = 1;
    queued = 2;
    submitted = 3;
    active = 4;
    aborted = 5;
    clear = 6;
    set = 7;
  }
  ForceState state = 1;
  bool recursive = 2;
  repeated string path = 3;
}

message FreeDepCommand {
  enum DepType {
    all = 0;
    trigger = 1;
    time = 2;
  }
  DepType dep_type = 1;
  repeated string path = 2;
}

message LoadCommand {
  string flow_type = 1;
  bytes flow = 2;
}

message BeginCommand {
  // 空串表示对 Bunch 中全部 flow 执行 begin。
  string flow_name = 1;
  bool force = 2;
}

//----------------------------------------
// query command

message ShowRequest{
  bool show_trigger = 1;
  bool show_parameter = 2;
  bool show_limit = 3;
  bool show_event = 4;
  bool show_meter = 5;
}

message ShowResponse{
  string output = 1;
}

message PingRequest {
}

message PingResponse {
}

message Coroutine{
  string name = 1;
  string description = 2;
}

message CoroutineRequest {
}

message CoroutineResponse {
  repeated Coroutine coroutines = 1;
}

//------------------------------------------

service TaklerServer {

  // child command
  rpc RunCommandInit(InitCommand) returns (ServiceResponse){}
  rpc RunCommandComplete(CompleteCommand) returns (ServiceResponse){}
  rpc RunCommandAbort(AbortCommand) returns (ServiceResponse){}
  rpc RunCommandEvent(EventCommand) returns (ServiceResponse){}
  rpc RunCommandMeter(MeterCommand) returns (ServiceResponse){}

  // control command

  rpc RunCommandRequeue(RequeueCommand) returns (BatchResponse){}

  rpc RunCommandSuspend(SuspendCommand) returns (BatchResponse){}
  rpc RunCommandResume(ResumeCommand) returns (BatchResponse){}

  rpc RunCommandRun(RunCommand) returns (BatchResponse) {}

  rpc RunCommandForce(ForceCommand) returns (BatchResponse) {}

  rpc RunCommandFreeDep(FreeDepCommand) returns (BatchResponse) {}

  rpc RunCommandLoad(LoadCommand) returns (ServiceResponse) {}

  rpc RunCommandBegin(BeginCommand) returns (BatchResponse) {}


  // query command

  rpc RunRequestShow(ShowRequest) returns (ShowResponse){}

  rpc RunRequestPing(PingRequest) returns (PingResponse){}

  rpc QueryCoroutine(CoroutineRequest) returns (CoroutineResponse){}
}
message BatchItemResult {
  uint32 index = 1;
  string target = 2;
  int32 flag = 3;
  string message = 4;
  string effect = 5;
}
message BatchResponse {
  int32 flag = 1;
  string message = 2;
  repeated BatchItemResult results = 3;
}
